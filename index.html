<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BulutFlash - Akıllı Sunum Sistemi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- Firebase SDKs for True Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #e2e8f0; 
            overscroll-behavior-y: contain; 
        }
        
        .neon-text-emerald {
            color: #34d399;
            text-shadow: 0 0 5px #059669, 0 0 15px #10b981;
        }
        .neon-text-cyan {
            color: #22d3ee;
            text-shadow: 0 0 5px #0891b2, 0 0 15px #06b6d4;
        }
        .neon-border-emerald {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25), inset 0 0 10px rgba(16, 185, 129, 0.1);
            border-color: #059669;
        }
        .neon-border-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.25), inset 0 0 10px rgba(6, 182, 212, 0.1);
            border-color: #0891b2;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bg {
            width: 100%;
            background-color: #1e293b;
            border-radius: 9999px;
            height: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .progress-fill {
            background-color: #10b981;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #10b981;
        }
        
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        #pdf-canvas { transform-origin: center center; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-cyan-500 selection:text-white">

    <header class="bg-[#0a0a0a] border-b border-slate-800 px-6 py-4 flex justify-between items-center z-25 shrink-0 shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
        <div class="flex items-center gap-3">
            <div class="bg-black border border-emerald-500 p-2 rounded-xl text-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.3)]">
                <i class="ph-bold ph-lightning text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">Bulut<span class="neon-text-emerald">Flash</span></h1>
        </div>
        <div id="connection-badge" class="text-xs font-semibold text-emerald-400 bg-emerald-950 border border-emerald-800 px-3 py-1.5 rounded-lg flex items-center gap-2 shadow-[0_0_10px_rgba(16,185,129,0.2)]">
            <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div> Bulut Senkronize
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
        <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
            
            <!-- SOL TARAF: Evde Yükleme Alanı -->
            <div class="bg-[#0f1219] border border-slate-800 rounded-3xl p-8 flex flex-col items-center text-center relative overflow-hidden group hover:neon-border-emerald transition-all duration-500">
                <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500 shadow-[0_0_15px_#10b981]"></div>
                
                <div class="w-24 h-24 bg-black border border-emerald-900 text-emerald-400 rounded-full flex items-center justify-center mb-6 mt-4 group-hover:scale-110 group-hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] transition-all duration-300">
                    <i class="ph-fill ph-folder-plus text-5xl drop-shadow-[0_0_8px_rgba(16,185,129,0.8)]"></i>
                </div>
                
                <h2 class="text-3xl font-extrabold mb-3 neon-text-emerald">1. Evde Yükle</h2>
                <p class="text-slate-400 mb-6 text-sm">Klasör adı (örn: MAT9) belirleyin ve PDF sunumunuzu buluta gönderin.</p>
                
                <div class="w-full flex flex-col gap-4 mb-4">
                    <input type="text" id="upload-folder-input" placeholder="KLASÖR ADINIZ (Örn: MAT9)" class="w-full px-4 py-4 bg-black border border-slate-700 rounded-2xl font-bold text-xl text-center text-white focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_15px_rgba(16,185,129,0.3)] uppercase placeholder:text-slate-600 transition-all">
                </div>

                <button onclick="document.getElementById('pdf-upload-input').click()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xl py-5 rounded-2xl shadow-[0_0_15px_rgba(16,185,129,0.4)] transition-all flex justify-center items-center gap-3 cursor-pointer">
                    <i class="ph-bold ph-upload-simple text-2xl"></i> PDF Seç & Yükle
                </button>
                <input type="file" id="pdf-upload-input" accept="application/pdf" class="hidden" onchange="window.handlePdfUpload(event)">
                <p class="text-xs text-slate-500 mt-4 font-semibold">Ortak Bulut Desteği (25 MB'a kadar)</p>

                <!-- Yükleme İlerlemesi -->
                <div id="upload-progress-container" class="w-full mt-6 hidden flex-col items-center">
                    <div class="flex items-center gap-3 text-emerald-400 font-bold mb-2">
                        <div class="loader !w-6 !h-6 !border-emerald-900 !border-t-emerald-400"></div>
                        <span id="upload-status-text" class="tracking-wide">Yükleniyor...</span>
                    </div>
                    <div class="progress-bg">
                        <div id="upload-progress-bar" class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- SAĞ TARAF: Okulda Açma Alanı -->
            <div class="bg-[#0f141e] border border-slate-800 rounded-3xl p-8 flex flex-col items-center text-center relative overflow-hidden group hover:neon-border-cyan transition-all duration-500">
                <div class="absolute top-0 left-0 w-full h-1 bg-cyan-500 shadow-[0_0_15px_#06b6d4]"></div>
                
                <div class="w-24 h-24 bg-black border border-cyan-900 text-cyan-400 rounded-full flex items-center justify-center mb-6 mt-4 group-hover:scale-110 group-hover:shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all duration-300">
                    <i class="ph-fill ph-chalkboard-teacher text-5xl drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]"></i>
                </div>
                
                <h2 class="text-3xl font-extrabold mb-3 neon-text-cyan">2. Okulda Aç</h2>
                <p class="text-slate-400 mb-6 text-sm">Klasör adınızı girin ve diğer cihazlardan attığınız sunumlara ulaşın.</p>
                
                <div class="w-full flex flex-col gap-4">
                    <input type="text" id="download-folder-input" placeholder="KLASÖR ADINIZ (Örn: MAT9)" class="w-full px-4 py-4 bg-black border border-slate-700 rounded-2xl font-bold text-xl text-center text-white focus:outline-none focus:border-cyan-500 focus:shadow-[0_0_15px_rgba(6,182,212,0.3)] uppercase placeholder:text-slate-600 transition-all">
                    
                    <button onclick="window.fetchFolderContents()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xl py-4 rounded-2xl shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all flex justify-center items-center gap-3 cursor-pointer">
                        <i class="ph-bold ph-folder-open text-2xl"></i> Klasörümü Aç
                    </button>
                </div>

                <!-- Klasör İçeriği Listesi -->
                <div id="folder-contents-container" class="w-full mt-6 hidden flex-col items-start gap-3 bg-black p-4 rounded-2xl border border-slate-800 max-h-48 overflow-y-auto">
                    <h3 class="text-slate-300 font-bold text-sm w-full text-left border-b border-slate-800 pb-2 mb-1 flex justify-between items-center">
                        <span class="text-cyan-400">Buluttaki Sunumlar</span>
                        <i class="ph-bold ph-files text-cyan-500"></i>
                    </h3>
                    <div id="file-list" class="w-full flex flex-col gap-2"></div>
                </div>
            </div>

        </div>
    </main>

    <div id="pdf-viewer-modal" class="fixed inset-0 bg-black z-50 hidden flex-col text-white">
        
        <!-- PDF Canvas Alanı -->
        <div id="pdf-canvas-container" class="flex-grow overflow-auto flex justify-center items-center bg-[#050505] cursor-grab active:cursor-grabbing relative touch-none">
            <canvas id="pdf-canvas" class="shadow-[0_0_40px_rgba(0,0,0,0.9)] rounded-md bg-white transition-transform duration-75 ease-out"></canvas>
        </div>

        <!-- PDF Alt Kontrol Çubuğu -->
        <div class="bg-[#0a0a0a] border-t border-slate-800 p-4 flex flex-wrap justify-between items-center shadow-[0_-10px_30px_rgba(0,0,0,0.8)] gap-4 z-10 shrink-0">
            
            <div class="flex items-center gap-3">
                <button onclick="window.closePdfViewer()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 transition-all shadow-[0_0_10px_rgba(220,38,38,0.3)] cursor-pointer">
                    <i class="ph-bold ph-power text-xl"></i> Çıkış
                </button>
                <span id="pdf-title-display" class="font-semibold hidden md:block text-slate-400 truncate max-w-[200px]">Sunum</span>
            </div>

            <!-- Sayfa Değiştirme -->
            <div class="flex items-center gap-2 bg-[#121212] border border-slate-800 p-1.5 rounded-2xl shadow-inner">
                <button onclick="window.prevPage()" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors cursor-pointer active:scale-95 text-cyan-400">
                    <i class="ph-bold ph-caret-left text-2xl"></i>
                </button>
                <div class="px-4 font-bold text-xl min-w-[5rem] text-center text-white tracking-widest">
                    <span id="page-num">1</span> <span class="text-slate-600">/</span> <span id="page-count" class="text-slate-400">?</span>
                </div>
                <button onclick="window.nextPage()" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors cursor-pointer active:scale-95 text-cyan-400">
                    <i class="ph-bold ph-caret-right text-2xl"></i>
                </button>
            </div>

            <!-- Zoom Kontrolleri -->
            <div class="flex items-center gap-2 bg-[#121212] border border-slate-800 p-1.5 rounded-2xl">
                <button onclick="window.zoomOut()" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors cursor-pointer text-slate-300">
                    <i class="ph-bold ph-magnifying-glass-minus text-2xl"></i>
                </button>
                <span id="zoom-level" class="font-bold text-sm min-w-[3.5rem] text-center text-emerald-400">100%</span>
                <button onclick="window.zoomIn()" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors cursor-pointer text-slate-300">
                    <i class="ph-bold ph-magnifying-glass-plus text-2xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Bildirim Konteyneri -->
    <div id="toast-container" class="fixed top-6 right-6 z-[60] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let styling = '';
            if(type === 'success') styling = 'bg-emerald-950 border border-emerald-500 text-emerald-100 shadow-[0_0_15px_rgba(16,185,129,0.5)]';
            else if(type === 'error') styling = 'bg-red-950 border border-red-500 text-red-100 shadow-[0_0_15px_rgba(239,68,68,0.5)]';
            else styling = 'bg-cyan-950 border border-cyan-500 text-cyan-100 shadow-[0_0_15px_rgba(6,182,212,0.5)]';
            
            const icon = type === 'success' ? 'ph-check-circle' : (type === 'error' ? 'ph-warning-circle' : 'ph-info');
            
            toast.className = `${styling} px-6 py-4 rounded-xl flex items-center gap-3 font-bold text-sm toast-enter pointer-events-auto backdrop-blur-md`;
            toast.innerHTML = `<i class="ph-fill ${icon} text-2xl"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                toast.style.transition = 'all 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        // Initialize Firebase Public Cloud Database
        const firebaseConfig = {
            apiKey: "AIzaSyD-BulutFlashPublicTestKey998877",
            authDomain: "bulutflash-app.firebaseapp.com",
            projectId: "bulutflash-app"
        };
        
        let db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch(e) {
            console.warn("Firebase initialized with local fallback");
        }

        // Chunking PDF to store large files in Firestore
        async function saveFileToCloud(folder, fileData, onProgress) {
            const folderUpper = folder.toUpperCase();
            const fileId = folderUpper + '_' + Date.now();
            const base64String = fileData.data;
            
            // Split base64 into ~500KB chunks
            const chunkSize = 500 * 1024;
            const totalChunks = Math.ceil(base64String.length / chunkSize);
            
            // Save Metadata first
            await db.collection('presentations').doc(fileId).set({
                fileId: fileId,
                folder: folderUpper,
                filename: fileData.filename,
                totalChunks: totalChunks,
                createdAt: Date.now()
            });

            // Save Chunks
            for (let i = 0; i < totalChunks; i++) {
                const chunkData = base64String.substring(i * chunkSize, (i + 1) * chunkSize);
                await db.collection('presentation_chunks').doc(`${fileId}_chunk_${i}`).set({
                    fileId: fileId,
                    chunkIndex: i,
                    data: chunkData
                });
                if (onProgress) {
                    onProgress(Math.round(((i + 1) / totalChunks) * 100));
                }
            }
            return true;
        }

        async function getFilesFromCloud(folder) {
            const folderUpper = folder.toUpperCase();
            const snapshot = await db.collection('presentations').where('folder', '==', folderUpper).get();
            const files = [];
            snapshot.forEach(doc => {
                files.push(doc.data());
            });
            return files;
        }

        async function getFileFullData(fileId, totalChunks, onProgress) {
            let fullData = "";
            for (let i = 0; i < totalChunks; i++) {
                const doc = await db.collection('presentation_chunks').doc(`${fileId}_chunk_${i}`).get();
                if (doc.exists) {
                    fullData += doc.data().data;
                }
                if (onProgress) {
                    onProgress(Math.round(((i + 1) / totalChunks) * 100));
                }
            }
            return fullData;
        }

        async function deleteFileFromCloud(fileId, totalChunks) {
            await db.collection('presentations').doc(fileId).delete();
            for (let i = 0; i < totalChunks; i++) {
                await db.collection('presentation_chunks').doc(`${fileId}_chunk_${i}`).delete();
            }
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null, scale = 1.5;
        const canvas = document.getElementById('pdf-canvas'), ctx = canvas.getContext('2d');

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                const renderContext = { canvasContext: ctx, viewport: viewport };
                
                page.render(renderContext).promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) { renderPage(pageNumPending); pageNumPending = null; }
                });
            });
            document.getElementById('page-num').textContent = num;
            document.getElementById('zoom-level').textContent = Math.round(scale * 100 / 1.5) + '%';
        }

        function queueRenderPage(num) {
            if (pageRendering) pageNumPending = num;
            else renderPage(num);
        }

        window.prevPage = function() { if (pageNum <= 1) return; pageNum--; queueRenderPage(pageNum); }
        window.nextPage = function() { if (pageNum >= pdfDoc.numPages) return; pageNum++; queueRenderPage(pageNum); }
        window.zoomIn = function() { if(scale >= 4.0) return; scale += 0.3; queueRenderPage(pageNum); }
        window.zoomOut = function() { if (scale <= 0.6) return; scale -= 0.3; queueRenderPage(pageNum); }

        window.closePdfViewer = function() {
            document.getElementById('pdf-viewer-modal').classList.add('hidden');
            document.getElementById('pdf-viewer-modal').classList.remove('flex');
            pdfDoc = null; 
            canvas.style.transform = 'none';
        }

        window.loadPdfFromBuffer = async function(uint8Array, filename = "Sunum") {
            try {
                document.getElementById('pdf-title-display').textContent = filename;
                const modal = document.getElementById('pdf-viewer-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                
                pdfDoc = await pdfjsLib.getDocument({ data: uint8Array }).promise;
                document.getElementById('page-count').textContent = pdfDoc.numPages;
                
                const containerWidth = document.getElementById('pdf-canvas-container').clientWidth;
                if(containerWidth < 800) scale = 1.0; 
                else scale = 1.5; 

                pageNum = 1;
                renderPage(pageNum);
            } catch (error) {
                window.closePdfViewer();
                window.showToast("PDF dosyası okunamadı.", "error");
            }
        };

        const container = document.getElementById('pdf-canvas-container');
        let isDown = false, startX, startY, scrollLeft, scrollTop;
        
        container.addEventListener('mousedown', (e) => {
            isDown = true; startX = e.pageX - container.offsetLeft; startY = e.pageY - container.offsetTop;
            scrollLeft = container.scrollLeft; scrollTop = container.scrollTop;
        });
        container.addEventListener('mouseleave', () => { isDown = false; });
        container.addEventListener('mouseup', () => { isDown = false; });
        container.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            container.scrollLeft = scrollLeft - ((e.pageX - container.offsetLeft) - startX) * 1.5;
            container.scrollTop = scrollTop - ((e.pageY - container.offsetTop) - startY) * 1.5;
        });

        let initialPinchDistance = null, initialPinchScale = null;
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isDown = false;
                initialPinchDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                initialPinchScale = scale;
            } else if (e.touches.length === 1) {
                isDown = true; startX = e.touches[0].pageX - container.offsetLeft; startY = e.touches[0].offsetTop - container.offsetTop;
                scrollLeft = container.scrollLeft; scrollTop = container.scrollTop;
            }
        }, {passive: false});

        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 2 && initialPinchDistance) {
                const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                canvas.style.transform = `scale(${currentDistance / initialPinchDistance})`;
            } else if (e.touches.length === 1 && isDown) {
                container.scrollLeft = scrollLeft - ((e.touches[0].pageX - container.offsetLeft) - startX) * 2;
                container.scrollTop = scrollTop - ((e.touches[0].pageY - container.offsetTop) - startY) * 2;
            }
        }, {passive: false});

        container.addEventListener('touchend', (e) => {
            if (initialPinchDistance && e.touches.length < 2) {
                const match = canvas.style.transform.match(/scale\(([^)]+)\)/);
                if (match) {
                    scale = Math.max(0.6, Math.min(initialPinchScale * parseFloat(match[1]), 4.0));
                    canvas.style.transform = 'none';
                    initialPinchDistance = null;
                    queueRenderPage(pageNum);
                }
            }
            if(e.touches.length === 0) isDown = false;
        });

        window.handlePdfUpload = async (event) => {
            const folderInput = document.getElementById('upload-folder-input').value.trim().toUpperCase();
            if(!folderInput) {
                event.target.value = '';
                return window.showToast('Lütfen önce bir KLASÖR ADI belirleyin!', 'error');
            }

            const file = event.target.files[0];
            if (!file) return;

            const progContainer = document.getElementById('upload-progress-container');
            const progBar = document.getElementById('upload-progress-bar');
            const statusTxt = document.getElementById('upload-status-text');
            
            progContainer.classList.remove('hidden');
            progContainer.classList.add('flex');
            progBar.style.width = '10%';
            statusTxt.innerText = "Dosya okunuyor...";

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    statusTxt.innerText = "Buluta parçalanarak yükleniyor...";
                    
                    await saveFileToCloud(folderInput, {
                        filename: file.name,
                        data: e.target.result
                    }, (percent) => {
                        progBar.style.width = percent + '%';
                        statusTxt.innerText = `Buluta Yükleniyor... %${percent}`;
                    });

                    progBar.style.width = '100%';

                    setTimeout(() => {
                        progContainer.classList.remove('flex');
                        progContainer.classList.add('hidden');
                        window.showToast(`Başarılı! "${folderInput}" bulut klasörüne kaydedildi.`);
                    }, 500);

                } catch(err) {
                    progContainer.classList.remove('flex');
                    progContainer.classList.add('hidden');
                    window.showToast("Buluta yüklenirken hata oluştu.", 'error');
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        };

        window.fetchFolderContents = async () => {
            const folderInput = document.getElementById('download-folder-input').value.trim().toUpperCase();
            if (!folderInput) return window.showToast("Lütfen klasör adını girin.", 'error');

            const folderContainer = document.getElementById('folder-contents-container');
            const fileList = document.getElementById('file-list');
            
            fileList.innerHTML = '<div class="text-sm text-cyan-500 italic flex items-center gap-2"><div class="loader !w-4 !h-4 border-cyan-500"></div> Buluttan aranıyor...</div>';
            folderContainer.classList.remove('hidden');
            folderContainer.classList.add('flex');

            try {
                const filesData = await getFilesFromCloud(folderInput);

                if (filesData.length === 0) {
                    fileList.innerHTML = `<div class="text-sm text-red-400 font-semibold p-3 border border-red-950 bg-red-950/50 rounded-lg">Bulutta ("${folderInput}") klasörü bulunamadı.</div>`;
                    return;
                }

                fileList.innerHTML = '';
                filesData.sort((a, b) => b.createdAt - a.createdAt);

                filesData.forEach(fileData => {
                    const itemContainer = document.createElement('div');
                    itemContainer.className = "w-full flex items-center justify-between bg-[#121824] border border-slate-700 hover:border-cyan-500 p-2 rounded-xl transition-all group";
                    
                    const openBtn = document.createElement('button');
                    openBtn.className = "flex-grow flex items-center gap-3 overflow-hidden text-left hover:bg-slate-800 p-2 rounded-lg cursor-pointer";
                    openBtn.innerHTML = `
                        <div class="bg-red-900/80 border border-red-500 p-2 rounded-lg shrink-0">
                            <i class="ph-fill ph-file-pdf text-red-400 text-2xl"></i>
                        </div>
                        <span class="font-bold text-slate-200 truncate group-hover:text-cyan-400">${fileData.filename}</span>
                    `;
                    openBtn.onclick = () => window.openCloudPdf(fileData.fileId, fileData.totalChunks, fileData.filename);

                    const btnGroup = document.createElement('div');
                    btnGroup.className = "flex items-center gap-1 shrink-0";

                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = "p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-950 rounded-lg cursor-pointer";
                    downloadBtn.innerHTML = `<i class="ph-bold ph-download-simple text-xl"></i>`;
                    downloadBtn.title = "İndir";
                    downloadBtn.onclick = () => window.downloadCloudPdf(fileData.fileId, fileData.totalChunks, fileData.filename);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = "p-2 text-slate-400 hover:text-red-400 hover:bg-red-950 rounded-lg cursor-pointer";
                    deleteBtn.innerHTML = `<i class="ph-bold ph-trash text-xl"></i>`;
                    deleteBtn.title = "Sil";
                    deleteBtn.onclick = async () => {
                        await deleteFileFromCloud(fileData.fileId, fileData.totalChunks);
                        window.showToast("Buluttan silindi.");
                        window.fetchFolderContents();
                    };

                    btnGroup.appendChild(downloadBtn);
                    btnGroup.appendChild(deleteBtn);
                    itemContainer.appendChild(openBtn);
                    itemContainer.appendChild(btnGroup);
                    fileList.appendChild(itemContainer);
                });

            } catch (error) {
                fileList.innerHTML = '<div class="text-sm text-red-400 p-2">Bulut kayıtları okunurken hata oluştu.</div>';
            }
        };

        window.openCloudPdf = async (fileId, totalChunks, filename) => {
            window.showToast("Buluttan indiriliyor...", "info");
            try {
                const base64Data = await getFileFullData(fileId, totalChunks);
                const res = await fetch(base64Data);
                const blob = await res.blob();
                const buffer = await blob.arrayBuffer();
                window.loadPdfFromBuffer(new Uint8Array(buffer), filename);
                window.showToast("Sunum Açıldı!");
            } catch(e) {
                window.showToast("Dosya indirilirken hata oluştu.", "error");
            }
        };

        window.downloadCloudPdf = async (fileId, totalChunks, filename) => {
            window.showToast("İndirme hazırlanıyor...", "info");
            try {
                const base64Data = await getFileFullData(fileId, totalChunks);
                const a = document.createElement('a');
                a.href = base64Data;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.showToast("İndirildi!");
            } catch(e) {
                window.showToast("İndirme başarısız.", "error");
            }
        };
    </script>
</body>
</html>
